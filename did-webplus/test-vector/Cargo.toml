[package]
name = "did-webplus-test-vector"
version = "0.1.0"
authors = ["Victor Dods <victor.dods@ledgerdomain.com>"]
edition = "2024"
description = "CLI for generating did:webplus test-vector microledgers"

[[bin]]
name = "did-webplus-test-vector"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.94"
clap = { version = "4.5.4", features = ["derive", "env"] }
did-webplus-test-vector-lib = { path = "../test-vector-lib", features = [
    "clap",
    "server",
] }
dotenvy = "0.15.7"
tokio = { version = "1.41", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3.17", features = ["env-filter"] }
