[package]
name = "did-webplus-test-vector-lib"
version = "0.1.0"
authors = ["Victor Dods <victor.dods@ledgerdomain.com>"]
edition = "2024"
description = "Deterministic generation of did:webplus test-vector microledgers (library)"

[features]
clap = ["dep:clap"]

[dependencies]
anyhow = "1.0.94"
base64 = "0.21.4"
blake3 = "1.5"
chacha20 = { version = "0.10", default-features = false, features = ["rng"] }
clap = { version = "4.5.4", optional = true, features = ["derive"] }
did-webplus-core = { path = "../core", features = [
    "ed25519-dalek",
    "ed448-goldilocks",
    "k256",
    "p256",
    "p384",
    "p521",
] }
did-webplus-jws = { path = "../jws", features = [
    "ed25519-dalek",
    "ed448-goldilocks",
    "k256",
    "mbx",
    "p256",
    "p384",
    "p521",
] }
did-webplus-mock = { path = "../mock" }
ed25519-dalek = { workspace = true, features = ["rand_core"] }
ed448-goldilocks = { workspace = true }
k256 = { workspace = true }
mbx = { workspace = true, features = [
    "ed25519-dalek",
    "ed448-goldilocks",
    "k256",
    "p256",
    "p384",
    "p521",
] }
p256 = { workspace = true }
p384 = { workspace = true }
p521 = { workspace = true, features = ["ecdsa"] }
rand_core = "0.10"
selfhash = { workspace = true, features = [
    "all-hash-functions",
    "jcs",
    "mbx",
    "serde",
] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0.107"
serde_json_canonicalizer = "0.3.0"
signature-dyn = { workspace = true, features = [
    "ed25519-dalek",
    "ed448-goldilocks",
    "k256",
    "p256",
    "p384",
    "p521",
    "random",
] }
thiserror = { version = "1.0.60", default-features = false }
time = { version = "0.3", features = ["macros", "serde", "serde-well-known"] }

[dev-dependencies]
ctor = { workspace = true }
did-webplus-doc-storage-mock = { path = "../doc-storage-mock" }
did-webplus-doc-store = { path = "../doc-store" }
test-util = { workspace = true }
tokio = { version = "1.41.0", features = ["macros", "rt-multi-thread"] }
tracing = { workspace = true }
